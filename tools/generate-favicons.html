<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generate Favicons</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;padding:20px}button{padding:8px 12px;margin-top:8px}</style>
</head>
<body>
  <h1>Generate favicon PNGs</h1>
  <p>This tool loads <code>assets/img/logo.jpg</code> and generates downloadable PNG favicons (32×32 and 16×16).</p>
  <button id="go">Generate favicons</button>
  <p id="status"></p>
  <canvas id="c" width="32" height="32" style="display:none"></canvas>

  <script>
    document.getElementById('go').addEventListener('click', async function(){
      const status = document.getElementById('status');
      status.textContent = 'Loading logo.jpg…';
      try{
        const resp = await fetch('../assets/img/logo.jpg');
        if(!resp.ok) throw new Error('Failed to load logo.jpg: '+resp.status);
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = ()=>{
          const sizes = [32,16];
          sizes.forEach(size=>{
            const canvas = document.getElementById('c');
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0,0,size,size);
            // draw white bg to avoid transparent holes
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0,0,size,size);
            // draw image centered, preserving aspect
            const ratio = Math.min(size/img.width, size/img.height);
            const w = img.width * ratio; const h = img.height * ratio;
            ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
            const data = canvas.toDataURL('image/png');
            const a = document.createElement('a');
            a.href = data;
            a.download = 'favicon-'+size+'.png';
            document.body.appendChild(a);
            a.click();
            a.remove();
          });
          URL.revokeObjectURL(url);
          status.innerHTML = 'Downloaded favicon-32.png and favicon-16.png. To create <code>favicon.ico</code>, use an online converter or run ImageMagick locally:<br><code>magick convert favicon-32.png favicon.ico</code>';
        };
        img.onerror = ()=>{ status.textContent = 'Error rendering logo.jpg'; };
        img.src = url;
      }catch(err){ status.textContent = 'Error: '+err.message; }
    });
  </script>
</body>
</html>
